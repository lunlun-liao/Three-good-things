plugins { id 'com.android.application' }
android {
    namespace 'com.lunlun.threegoodthings'
    compileSdk 35
    defaultConfig {
        applicationId 'com.lunlun.threegoodthings'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'com.lunlun.threegoodthings.NativeSmokeTest'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
